spring:
  datasource:
    url: jdbc:h2:mem:gww;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:db/migration/V1__initial.sql,classpath:db/migration/V2__inquiry_contact_fields.sql,classpath:db/migration/V3__content_sections.sql
  cache:
    type: simple
app:
  admin:
    username: admin
    # 测试专用，明文 "password" 自动 BCrypt 编码。
    password: password
springdoc:
  api-docs:
    enabled: true

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/gww?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  # Redis暂时禁用，会话由内嵌Tomcat管理，缓存仅保留在本机内存。
  cache:
    type: simple
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        name: GWWSESSION
        http-only: true
        same-site: lax
app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    # 填写明文或 BCrypt 哈希均可，自动识别。
    password: ${ADMIN_PASSWORD:}
  media:
    public-root: ${MEDIA_PUBLIC_ROOT:}
    private-root: ${MEDIA_PRIVATE_ROOT:}
    public-url-prefix: ${MEDIA_PUBLIC_URL_PREFIX:/media/}
    max-upload-bytes: ${MEDIA_MAX_UPLOAD_BYTES:20971520}
mybatis:
  configuration:
    map-underscore-to-camel-case: true
